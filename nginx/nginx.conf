upstream supplier_review_backend {
    # Default round-robin: both Web processes serve both HTML and API calls.
    server app1:8000 max_fails=3 fail_timeout=10s;
    server app2:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # The demo entry point: http://localhost:8080
    location / {
        proxy_pass http://supplier_review_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
