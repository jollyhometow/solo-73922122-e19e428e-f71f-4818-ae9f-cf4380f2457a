x-app-common: &app-common
  build:
    context: .
  image: supplier-review:local
  environment:
    DB_PATH: /data/review.db
    SEED_CSV: /app/data/suppliers.csv
    SEED_LIMIT: "100"
  volumes:
    - review-db:/data
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 8s
  restart: unless-stopped

services:
  app1:
    <<: *app-common
    environment:
      DB_PATH: /data/review.db
      SEED_CSV: /app/data/suppliers.csv
      SEED_LIMIT: "100"
      APP_INSTANCE: app1

  app2:
    <<: *app-common
    environment:
      DB_PATH: /data/review.db
      SEED_CSV: /app/data/suppliers.csv
      SEED_LIMIT: "100"
      APP_INSTANCE: app2

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  review-db:
